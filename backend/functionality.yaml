# frame-shop — backend functionality
#
# The project is mid-restart. Nothing here is implemented. This file captures
# every requirement and design decision reached before the reset, so the re-plan
# starts from them rather than from scratch. The full prior prototype (which did
# implement all of this) is at `git checkout prototype-v0`; the visualizer it
# built is preserved under /schematic-visualizer.

goal: >
  Software for running a custom picture-framing shop. The innovation target is
  the *experience* of using it; the data model stays conventional and flexible
  enough to grow into full shop-management software. Purpose-built for custom
  framing — not a generic ERP.

constraints:
  - Browser-based application.
  - Python backend; domain / business logic lives in Python.
  - Frontend and backend cleanly separated; important framing / pricing / business
    rules never live only in the frontend.
  - Relational database unless there's a compelling reason otherwise.
  - Prefer boring, understandable technology over unnecessary infrastructure.
  - Eventually used simultaneously at a front counter, wood shop, mounting/matting
    area, and pickup area — design so different interfaces can sit on the same data.
  - Don't over-engineer, but don't make early decisions that block growth.

stack_in_use:  # what the prototype used — not binding on the re-plan
  - FastAPI + SQLAlchemy 2.0 + Alembic + Pydantic v2, Python 3.12
  - SQLite for dev; schema kept Postgres-compatible (JSON columns, Decimal, no
    SQLite-only SQL)
  - Layering: api -> services -> domain, services -> db. `domain/` imports no web
    framework and no ORM. It works on plain dataclasses; services map ORM <-> data.

conventions:
  - Money is an integer number of cents everywhere. Never float.
  - Measurements are Decimal inches; shop-style fraction input ("16 1/2",
    "16-1/2", "1/2") is parsed at the edge.
  - Every schema change goes through a migration.
  - Catalog reference data is a different concept from transaction data.
  - Historical sales/production records never change when catalog or pricing
    changes — accepted work carries an immutable snapshot.
  - Statuses/types are plain strings validated in the service/domain layer so the
    vocabulary can evolve without a migration per value.

# ---------------------------------------------------------------------------
domain_model:

  design:
    summary: >
      A Design is a universal *fabrication specification* — what the framer
      builds interactively with the customer. NOT "art framing"; artwork is
      optional. It is an editable spec, not yet a production commitment.
    structure:
      - Built around one **base rectangle**: `base_width_in`, `base_height_in`,
        and `base_ref` = what that rectangle represents:
        art | sight | glass | rabbet | outside.
      - Owns a **flat, ordered list of typed components** (see component_kinds).
        Order is outside -> inside (the traditional framing description).
      - `type` — a *light* tag: framing | mat_only | glazing_only | frame_only |
        canvas_stretch | object_box | swap | repair | other. It seeds a starter
        component stack and picks the intake mode (which base dimension is asked,
        whether the artwork block shows). It does NOT restrict which components a
        design may contain, and never becomes a fixed schema.
      - Optional artwork **metadata** on the Design itself: art_title,
        art_description, art_type (print_photo | canvas | works_on_paper |
        textile | object_3d), art_depth_in, art_notes. There is NO Artwork table.
      - `quantity` (default 1) — identical physical pieces, for trade batches.
      - `provenance` per component: shop | customer (customer-supplied material).
    do_not:
      - Do NOT assume a fixed schema (moulding / mat_1 / mat_2 / glass / mount).
      - Do NOT lock the design into a single canonical linear "stack" either.
      - Do NOT build a generic tree/graph. Flexibility comes from a good domain
        model, not a generic abstraction framework. The one nesting allowance is a
        single optional `parent_component_id` for cases framing genuinely nests
        (stacked moulding, fillet inside a mat opening).
    representations:
      - Multiple views are derived by **pure functions** of the component list:
        (1) the outside-to-inside textual description,
        (2) the exploded schematic model (see /schematic-visualizer/NOTES.md).
      - The UI representation must not dictate the database model.
    lifecycle:
      - A Design may be a **loose draft** with no order and no customer. It is
        created (autosaved, Gmail-style) as soon as base dimensions are entered;
        navigating away keeps it.
      - Statuses: draft | accepted | discarded. "On an order" is just
        `order_id != null`, not a status. A quote is a printed draft.
      - Reserved for later: `version` + `updated_at` (optimistic concurrency),
        `supersedes_id` (revision lineage).

  component_kinds:
    summary: >
      Each kind is a small class in a registry: a Pydantic param model
      (validated on every write), a default layer_role for the schematic, whether
      it consumes a catalog product, whether it renders as a physical layer, a
      geometry() method, and a label. Adding a kind = one class + one register();
      the Design schema does not change.
    kinds: [moulding, mat, fillet, glazing, mount, backing, spacer, fabric, service, other]
    geometry_walk: >
      `walk_layers` starts at the base rectangle and moves outward, each kind
      reporting its footprint, its window/opening, the linear/area material it
      consumes, and the new running outer size. Both pricing and the
      representations consume this one walk. The math is placeholder — good
      enough for a schematic and a demo price, not a real cut sheet.
    effective_params_hook: >
      Before geometry() runs, `effective_params(params, product)` lets a selected
      catalog product override typed params (moulding/fillet take the face width
      from the product's real profile). geometry() itself keeps a pure
      (params, inner_size) signature.

  scenarios_to_support:
    - Walk-in with artwork — measure it, design framing. Most common.
    - Phone quote — dimensions + a type; no artwork attached (the point is a
      price); optionally attach a name so it's findable later; otherwise it just
      stays an autosaved draft.
    - Trade order, assembled frames — another shop orders finished frames; simple
      designs, no artwork; the batch is one Order with customer info + due date.
    - Trade order, chops / sticks — moulding cut (or not) to length; like the
      above; how many Work Orders per batch is TBD.
    - Mats cut / mats wrapped in fabric / a piece of glass — simple, no artwork,
      same design + visualizer system.
    - Canvas stretch — build a stretcher, stretch a canvas.
    - Shadowbox / objects — depth spacers, object mounting.
    - Art swap — customer brings a framed piece, wants the art changed for
      something they provide.
    - Customer-supplied frame (+ their art) — the frame component is
      `provenance: customer`, carries a small handling charge, still visualizes.
    - Repair — usually broken glass, sometimes frame repair. Keep it very simple:
      the existing (customer) frame for sizing + the replacement component(s) +
      a fit/labour service.

  order:
    summary: >
      The customer-facing commercial transaction. A customer bringing in several
      pieces is one Order with several Designs — not several transactions.
    is: effectively a list of Designs; add more any time.
    add_to_order: where customer info is collected (existing or new customer,
      optional due date / PO number).
    home_for: [subtotal, discounts, tax, payments, deposit, balance, invoice]  # not built yet
    retail_material: >
      Loose material sold as-is (an uncut stick, a full sheet of glass) is a
      **sale-line on the Order**, not a Design. If the shop fabricates it
      (cut/join/wrap/fit) it's a Design. (deferred)
    numbering: Order.number is a sequence starting at 5271.

  work_order:
    summary: >
      One physical finished piece the shop has committed to producing and
      delivering. Customer -> Order -> one or more Work Orders.
    generated_from: an accepted Design (one per accepted Design / piece; or per
      `quantity` unit — TBD).
    holds: an **immutable snapshot** taken at accept time — the fully resolved
      spec + descriptions + costs + prices + the pricing-profile id/version.
      Live catalog or pricing changes never touch it. Invoices and production
      lists read the snapshot, not live data.
    numbering: "{order.number}-{n}"  e.g. 5271-1, 5271-2
    revisions: editing an accepted Design creates a new Design row with
      `supersedes_id`, re-accepted -> a new Work Order revision. (deferred)
    status: not built yet — see state_facets below.

  state_facets:
    principle: >
      Financial, production, and fulfillment state are NOT one giant status.
      A job can be simultaneously production:assembled, payment:deposit-paid,
      fulfillment:in-shop.
    facets: [payment_state, production_state, fulfillment_state]   # independent columns
    kinds_of_state:
      explicit: something a worker actually recorded (a leaf task marked done)
      derived: something the system infers from prerequisites
               (frame ready + artwork ready -> "ready to fit")
      display: a simpler label shown in the UI
    principles:
      - Minimise worker "touches" — too many state updates and workers stop
        maintaining accuracy. The internal model may be more granular than the UI.
      - Frame fabrication and artwork preparation happen in parallel — not one
        rigid sequential state machine.
      - Production = a Work Order's tasks/operations with dependencies, from which
        higher-level progress is derived. A tiny hard-coded template per design
        type. NOT a generic enterprise workflow engine.
    production_stages_seen:
      frame: [needs fabrication, in progress, ready]
      artwork: [needs mounting/attachment, prep in progress, ready]
      assembly: [waiting for prerequisites, ready to fit, fit/assembled]
      then: delivered (customer picks up + settles balance)

  pricing:
    - Interactive editing continuously produces a price.
    - Pricing logic lives in the backend/domain layer (frontend may show an
      optimistic estimate, backend response wins).
    - Rules are a **separate, versioned `PricingProfile`**; the Design stores no
      authoritative price, only a display cache (`price_breakdown` JSON +
      `priced_at` + profile id/version).
    - The actual framing pricing system is NOT specified — do not invent detailed
      rules. Placeholder rules only. The architecture must let rules evolve
      without touching the Design model.
    - Each component kind exposes a fixed fact vocabulary the profile consumes:
      linear_in / united_in / area_sqin / flat (+ resolved product unit cost/price).

  catalog:
    entities:
      vendor: { fields: [name, code, is_house], note: "is_house = the shop's own mill" }
      product:
        commercial: [vendor_id, kind, sku, name, description, unit_cost_cents,
                     unit_price_cents, price_uom, available, discontinued]
        physical: >
          a `spec` JSON column, validated per-kind by a Pydantic model
          (same "flexible storage, typed at the edges" pattern as component
          params). Keeps `product` narrow and lets each kind define its shape.
        moulding_spec: [face_width_in, height_in, rabbet_width_in, rabbet_height_in,
                        material, species, finish, family]
        note: >
          face_width drives the frame's outer size + linear feet; rabbet_height is
          the channel depth (a "will it fit?" check compares it to the layer-stack
          depth); species = the wood for solid stock, finish = surface treatment
          (oiled / gold leaf / …); family groups a profile's height & species
          variants. A richer profile shape (curved / ogee / slanted) is later an
          optional nested field on the spec — no migration.
    price_uom: [per_linear_ft, per_united_in, per_sqft, each, sheet]
    house_vs_vendor: >
      Both stored the same way. For a house moulding, unit_cost_cents is the cost
      to produce and there's no external SKU to reconcile.
    sku_convention:
      - Short, stable, only lightly structured. The SKU is an identifier, not a
        data store — encoding measurements into it creates facts that drift out of
        sync with the real fields.
      - Family code + optional height marker + species, e.g. SQ34-WAL,
        SQ34T-WAL. No marker = the standard height; a short marker (T) for a
        variant. <= ~12 chars, uppercase, one hyphen before species, [A-Z0-9-].
      - Never reuse a retired SKU. Never put a number in the SKU that is already a
        spec field. `spec.family` is what groups the variants for a
        "pick a profile, then height + species" UI.
      - Non-standard height = NOT a catalog SKU: the framer picks the nearest
        standard SKU + a "custom mill to X in" service line, which adds a labour
        charge and a work-order note. (deferred)
    data_and_import:
      - Catalog data seeded from a hand-editable file; loader validates each spec
        and upserts by (vendor, sku) so re-running updates rows.
      - Follow-ups: a CSV / spreadsheet importer (the ingestion seam), and a
        browser catalog-admin page. Live vendor API feeds are out of scope early
        but the architecture leaves an obvious place for them.
    discontinued_warning: >
      If a discontinued / unavailable product is on an active Design, warn.
      Draft designs always re-resolve the live catalog; accepted work reads its
      snapshot.

  daily_closing_and_lists:
    what: >
      LifeSaver-style "daily closing" generates separate production/material lists
      (moulding cut list, matboard list, glazing list, fabrics, wood-shop queue,
      mounting queue) — pick/cut/work lists for the different shop areas.
    rule: >
      The database must NOT make a printed "daily closing" list the source of
      truth. Everything (today's moulding cut list, matboard list, glazing list,
      wood-shop queue, mounting queue, rush additions, reprinted historical lists)
      is DERIVED from canonical Design / Work Order / production data.
    open: whether "Daily Closing" stays an explicit user action.

  images:
    - Per-design artwork photos, stored as files on disk under a media dir; a
      `design_image` table for metadata (source = upload | camera, is_primary).
    - A `CaptureSource` abstraction for an eventual ceiling-mounted camera over
      the design table, triggered from the design page. Default source "none"
      returns 501; real drivers (USB / gphoto2 / IP camera) register later.

# ---------------------------------------------------------------------------
api_surface:  # what the frontend (and future shop-station UIs) need
  - Catalog reads: component kinds + their param JSON schemas; design types +
    starter stacks; products (with `spec`) filtered by kind; vendors; per-kind
    product spec schemas.
  - Design: create (loose draft ok — everything optional); read (rich read model:
    components with resolved product + spec, live price breakdown, the two
    representations, a finished-size summary, warnings, `complete` flag while
    dimensions are missing); patch (name / status / type / base dims / art /
    quantity / customer / full component list).
  - Add a design to an order (pick / create customer, optional due date).
  - Per-design images: upload (multipart), list, serve bytes, delete, capture.
  - Customers: list (with order counts) + create; Orders: list + detail (its
    designs).

deferred:
  - Accept -> snapshot -> Work Order.
  - The three production state facets + task templates.
  - Order financials / payments / deposits / invoices.
  - Retail sale-lines on an Order.
  - CSV/spreadsheet catalog importer; browser catalog-admin page.
  - OpenAPI-generated frontend types.
  - Postgres migration + optimistic concurrency for real multi-station use.
  - Auth / permissions / roles.
  - Real vendor API feeds.
  - A possible `Job` layer between Order and Design if quantity + mixed
    fabricated/retail lines + per-line due dates pile up.

open_risks:
  - `sequence` + a single `parent_component_id` cannot fully encode true spatial
    nesting (e.g. a fillet *inside* a mat opening vs. simply beneath it). The
    early schematic is approximate on purpose — revisit before the schematic gets
    sophisticated or before cut lists depend on exact nesting.
  - Whether artwork ever needs to be a first-class "Piece" entity again (for
    production tagging) — currently it's metadata on the Design.
