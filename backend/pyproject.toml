[project]
name = "frameshop-pricing"
version = "0.2.1"
description = "Moulding pricing engine for the frame-shop domain model"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frameshop_pricing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
